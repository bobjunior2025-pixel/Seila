name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilação (debug ou release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK do ReinoFoot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Gerar Gradle Wrapper se necessário
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Gerando gradle wrapper..."
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x gradlew

      - name: Compilar APK Debug
        if: "${{ github.event.inputs.build_type != 'release' }}"
        run: ./gradlew assembleDebug --stacktrace

      - name: Compilar APK Release
        if: "${{ github.event.inputs.build_type == 'release' }}"
        run: ./gradlew assembleRelease --stacktrace

      - name: Identificar APK gerado
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK encontrado em: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          APK_NAME=$(basename "$APK_PATH")
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Fazer Upload do APK (Artefato GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: ReinoFoot-${{ github.event.inputs.build_type || 'debug' }}-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Resumo da Execução
        run: |
          echo "### ⚔️ ReinoFoot - APK Compilado com Sucesso! 🛡️" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Arquivo:** \`${{ steps.find_apk.outputs.apk_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Concluído com sucesso e disponível para download na aba **Artifacts**." >> $GITHUB_STEP_SUMMARY
